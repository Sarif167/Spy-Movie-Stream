<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMWBD Style Stream</title>
    <style>
        body { background-color: #0f1014; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { color: #ff3366; text-align: center; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 20px; }
        .movie-card { background: #1a1c23; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .movie-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; }
        .btn { display: inline-block; background: #ff3366; color: white; text-decoration: none; padding: 8px 12px; border-radius: 4px; font-size: 14px; }
    </style>
</head>
<body>

    <h1>SPY STREAM MOVIES</h1>
    <div id="movie-container" class="movie-grid">Loading movies...</div>

    <script>
        // Yahan apne Koyeb backend ka link dalein (Jaise: https://your-koyeb-app.koyeb.app/api/movies)
        fetch('https://yappy-berti-new11-38bf5e99.koyeb.app/')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('movie-container');
                container.innerHTML = '';
                if(data.length === 0) {
                    container.innerHTML = '<p>No movies added yet. Send via Telegram Bot!</p>';
                    return;
                }
                data.forEach(movie => {
                    container.innerHTML += `
                        <div class="movie-card">
                            <div class="movie-title">${movie.title}</div>
                            <a href="https://t.me/YOUR_BOT_USERNAME" class="btn" target="_blank">Watch / Download</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                document.getElementById('movie-container').innerHTML = '<p>Failed to load movies.</p>';
            });
    </script>

</body>
</html>
