<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPY STREAM MOVIES</title>
    <style>
        body { background-color: #0f1014; color: #fff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #ff3366; }
        .movie-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; margin-top: 20px; }
        .movie-card { background: #1a1c23; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .movie-title { font-size: 16px; font-weight: bold; margin-bottom: 10px; word-break: break-word; }
        .btn { display: inline-block; background: #ff3366; color: white; text-decoration: none; padding: 8px 15px; border-radius: 5px; font-size: 14px; margin-top: 10px; }
        .btn:hover { background: #e02e5b; }
    </style>
</head>
<body>

    <h1>SPY STREAM MOVIES</h1>
    <div id="movie-container" class="movie-grid">Loading movies...</div>

    <script>
        // Fetch movies from your Koyeb backend
        fetch('https://yappy-berti-new11-38bf5e99.koyeb.app/movies')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('movie-container');
                container.innerHTML = '';
                
                if (!data || data.length === 0) {
                    container.innerHTML = '<p>No movies added yet. Send via Telegram Bot!</p>';
                    return;
                }

                data.forEach(movie => {
                    container.innerHTML += `
                        <div class="movie-card">
                            <div class="movie-title">${movie.title || 'Untitled Movie'}</div>
                            <a href="${movie.file_url || '#'}" class="btn" target="_blank">Watch / Download</a>
                        </div>
                    `;
                });
            })
            .catch(err => {
                console.error('Error loading movies:', err);
                document.getElementById('movie-container').innerHTML = '<p>Failed to load movies.</p>';
            });
    </script>

</body>
</html>
