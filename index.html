<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spy Movie Stream</title>
    <style>
        body {
            background-color: #0f1014;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background: #1a1c23;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2f333d;
        }
        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ff3366;
        }
        .container {
            padding: 20px;
        }
        h2 {
            font-size: 18px;
            border-left: 4px solid #ff3366;
            padding-left: 10px;
            margin-bottom: 15px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        .movie-card {
            background: #1a1c23;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .movie-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }
        .movie-info {
            padding: 10px;
        }
        .movie-title {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .btn {
            display: block;
            text-align: center;
            background: #ff3366;
            color: white;
            text-decoration: none;
            padding: 6px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SPY STREAM</div>
    </header>

    <div class="container">
        <h2>Trending Movies</h2>
        <div class="movie-grid">
            <!-- Movie 1 -->
            <div class="movie-card">
                <img src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=400" alt="Movie">
                <div class="movie-info">
                    <div class="movie-title">Action Thriller 2026</div>
                    <a href="#" class="btn">Watch / Download</a>
                </div>
            </div>
            <!-- Movie 2 -->
            <div class="movie-card">
                <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?w=400" alt="Movie">
                <div class="movie-info">
                    <div class="movie-title">Sci-Fi Universe</div>
                    <a href="#" class="btn">Watch / Download</a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
